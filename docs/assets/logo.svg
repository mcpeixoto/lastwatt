<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="lastwatt">
  <title>lastwatt — survive power outages on internal battery</title>
  <style>
    :root { color-scheme: light dark; }
    .ink      { fill: #0d1117; }
    .ink-soft { fill: #57606a; }
    .shell    { fill: none; stroke: #0d1117; stroke-width: 7; }
    .track    { fill: #0d1117; opacity: .06; }
    @media (prefers-color-scheme: dark) {
      .ink      { fill: #e6edf3; }
      .ink-soft { fill: #8b949e; }
      .shell    { stroke: #e6edf3; }
      .track    { fill: #e6edf3; opacity: .10; }
    }

    /* The charge drains fast while everything is running, then the tiers shed
       and it slows to a crawl. That contrast is the whole product. */
    .charge {
      animation: drain 9s cubic-bezier(.4,0,.7,1) infinite;
      transform-origin: 0 0;
    }
    @keyframes drain {
      0%   { transform: scaleX(1);   fill: #2da44e; }
      28%  { transform: scaleX(.52); fill: #bf8700; }
      38%  { transform: scaleX(.40); fill: #bf8700; }   /* shed happens here */
      92%  { transform: scaleX(.10); fill: #cf222e; }
      96%  { transform: scaleX(1);   fill: #2da44e; }   /* mains returns */
      100% { transform: scaleX(1);   fill: #2da44e; }
    }

    /* Four tier blocks drop away in sequence, which is what buys the runtime. */
    .tier { animation: shed 9s linear infinite; }
    .t1 { animation-delay: -8.10s; }
    .t2 { animation-delay: -7.85s; }
    .t3 { animation-delay: -7.60s; }
    .t4 { animation-delay: -7.35s; }
    @keyframes shed {
      0%, 8%   { opacity: 1; transform: translateY(0); }
      13%      { opacity: 0; transform: translateY(-16px); }
      96%      { opacity: 0; transform: translateY(-16px); }
      99%,100% { opacity: 1; transform: translateY(0); }
    }

    .bolt { animation: spark 9s ease-in-out infinite; transform-origin: 232px 120px; }
    @keyframes spark {
      0%,30%   { opacity: 0; transform: scale(.7); }
      36%      { opacity: 1; transform: scale(1.12); }
      44%,100% { opacity: .9; transform: scale(1); }
    }

    .pulse { animation: breathe 9s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity:.30 } 50% { opacity:.06 } }
  </style>

  <!-- tier blocks: shed one by one -->
  <g>
    <rect class="tier t1 ink" x="60"  y="34" width="26" height="10" rx="3"/>
    <rect class="tier t2 ink" x="94"  y="34" width="26" height="10" rx="3"/>
    <rect class="tier t3 ink" x="128" y="34" width="26" height="10" rx="3"/>
    <rect class="tier t4 ink" x="162" y="34" width="26" height="10" rx="3"/>
  </g>

  <!-- battery -->
  <rect class="shell" x="54" y="66" width="196" height="108" rx="18"/>
  <rect class="ink"   x="258" y="104" width="16" height="32" rx="6"/>
  <rect class="track" x="70" y="82" width="164" height="76" rx="10"/>
  <g transform="translate(70 82)">
    <rect class="charge" width="164" height="76" rx="10"/>
  </g>

  <!-- the last watt -->
  <path class="bolt" d="M156 88 L118 128 h26 l-10 40 l40 -46 h-27 z"
        fill="#ffffff" stroke="#0d1117" stroke-width="4" stroke-linejoin="round"/>

  <!-- wordmark -->
  <g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="320" y="136" font-size="76" letter-spacing="-2">
      <tspan class="ink-soft" font-weight="300">last</tspan><tspan class="ink" font-weight="700">watt</tspan>
    </text>
    <text x="324" y="176" class="ink-soft" font-size="21" font-weight="400" letter-spacing="3.4">
      SHED LOAD. STAY UP.
    </text>
  </g>

  <circle class="pulse ink" cx="861" cy="112" r="7"/>
</svg>
