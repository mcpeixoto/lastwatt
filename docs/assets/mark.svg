<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="lastwatt mark">
  <title>lastwatt</title>
  <style>
    .shell { fill:none; stroke:#0d1117; stroke-width:11; }
    .cap   { fill:#0d1117; }
    .track { fill:#0d1117; opacity:.07; }
    @media (prefers-color-scheme: dark) {
      .shell { stroke:#e6edf3; } .cap { fill:#e6edf3; } .track { fill:#e6edf3; opacity:.12; }
    }
    .charge { animation: drain 9s cubic-bezier(.4,0,.7,1) infinite; transform-origin: 0 0; }
    @keyframes drain {
      0%   { transform: scaleY(1);   fill:#2da44e; }
      28%  { transform: scaleY(.52); fill:#bf8700; }
      92%  { transform: scaleY(.10); fill:#cf222e; }
      96%,100% { transform: scaleY(1); fill:#2da44e; }
    }
    .bolt { animation: spark 9s ease-in-out infinite; transform-origin: 128px 140px; }
    @keyframes spark {
      0%,30% { opacity:0; transform:scale(.7); }
      36%    { opacity:1; transform:scale(1.14); }
      44%,100% { opacity:.95; transform:scale(1); }
    }
  </style>
  <rect class="cap"   x="104" y="20" width="48" height="20" rx="7"/>
  <rect class="shell" x="52"  y="44" width="152" height="196" rx="26"/>
  <rect class="track" x="72"  y="64" width="112" height="156" rx="14"/>
  <g transform="translate(72 64)">
    <rect class="charge" width="112" height="156" rx="14"/>
  </g>
  <path class="bolt" d="M150 78 L100 146 h30 l-14 62 l52 -78 h-32 z"
        fill="#ffffff" stroke="#0d1117" stroke-width="7" stroke-linejoin="round"/>
</svg>
